name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Application and Archives
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_app.sh

      - name: Create DMG Disk Image
        run: |
          ./scripts/create_dmg.sh || echo "DMG creation skipped or completed"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caffeine-macOS-Build
          path: |
            dist/*
            build/Caffeine.app

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Caffeine ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
